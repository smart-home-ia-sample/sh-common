name: ci

# Release only. Tests + coverage run in test.yml on every PR / main push;
# here they run once more as a guard so a broken tag never publishes a wheel.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release + attach the wheel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: pipx run build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
