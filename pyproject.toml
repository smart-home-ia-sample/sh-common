[project]
name = "sh-common"
version = "0.1.0"
description = "Shared utilities for Smart Home AI services (logging, correlation, self-registration)"
requires-python = ">=3.11"
dependencies = ["httpx", "mcp==2.1.1", "pydantic", "a2a-sdk[fastapi]==1.1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["smart_home_common"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.coverage.run]
source = ["smart_home_common"]
omit = ["smart_home_common/__init__.py"]

[tool.coverage.report]
show_missing = true
# CI "test / coverage" gate: pytest-cov fails the run below this.
fail_under = 65
